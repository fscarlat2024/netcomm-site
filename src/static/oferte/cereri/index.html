<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cereri din oferte · NCS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
:root{--r:#992736;--rs:#F6E8EA;--ink:#1C2025;--mut:#5E6168;--line:#E7D3D6;--bg:#f6f1f2;--paper:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rs:#3A1D23;--ink:#EDEDF0;--mut:#A6A9B0;--line:#2D3137;--bg:#131518;--paper:#1B1E22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Source Sans 3',Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:28px 16px 60px}
.ey{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--r)}
h1{font-size:28px;margin:4px 0 4px;font-weight:800}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--r);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.chip{background:var(--rs);color:var(--r);font-weight:700;border-radius:999px;padding:2px 10px;font-size:12px}
.card h2{font-size:18px;margin:8px 0 4px}
.card p{margin:4px 0}
details{margin-top:8px;font-size:14px;color:var(--mut)}
summary{cursor:pointer;color:var(--r);font-weight:600}
.empty,.err{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--mut)}
button{font:600 15px 'Source Sans 3',Arial,sans-serif;background:var(--r);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="ey">NCS · intern</div>
  <h1>Cereri din oferte</h1>
  <p class="sub">Ce au cerut clienții prin asistenții de ofertă și nu e în ofertă, plus întrebările trimise ție personal.</p>
  <div id="list"><div class="empty">Se încarcă…</div></div>
  <p><button id="reload" type="button">Reîncarcă</button></p>
</main>
<script src="/oferte/cereri/cereri.js" defer></script>
</body>
</html>
